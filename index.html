            ]
        };
        // ------------------------------------------

        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeSlider = document.getElementById('timeSlider');
        const sliderValue = document.getElementById('sliderValue');

        let isRunning = false;
        let timeoutId = null;
        let currentAudio = null;

        timeSlider.addEventListener('input', (e) => {
            sliderValue.textContent = parseFloat(e.target.value).toFixed(1);
        });

        const pause = (ms) => new Promise(resolve => {
            timeoutId = setTimeout(resolve, ms);
        });

        // Function to handle playing an audio string and waiting until it finishes
        function playAudio(base64String) {
            return new Promise((resolve) => {
                if (!isRunning) return resolve();
                
                currentAudio = new Audio(base64String);
                
                currentAudio.onended = () => resolve();
                currentAudio.onerror = () => {
                    console.error("Audio failed to play. Check Base64 string.");
                    resolve();
                };
                
                currentAudio.play().catch(err => {
                    console.warn("Playback blocked. Click the page first.", err);
                    resolve();
                });
            });
        }

        async function startSequence() {
            isRunning = true;
            playBtn.disabled = true;
            stopBtn.disabled = false;

            // 1. Play Wuji.mp3
            await playAudio(audioAssets.wuji);
            if (!isRunning) return;

            // 2. Pause for 3 seconds
            await pause(3000);
            if (!isRunning) return;

            // 3. Play En Guarde.mp3
            await playAudio(audioAssets.enGuarde);
            if (!isRunning) return;

            // 4. Pause for 2 seconds
            await pause(2000);
            
            // 5. Start the infinite loop
            loopRandomWords();
        }

        async function loopRandomWords() {
            while (isRunning) {
                // Pick a random track from the pool
                const randomTrack = audioAssets.randomPool[Math.floor(Math.random() * audioAssets.randomPool.length)];
                
                await playAudio(randomTrack);
                if (!isRunning) break;

                // Pause based on the slider value
                const delayMs = parseFloat(timeSlider.value) * 1000;
                await pause(delayMs);
            }
        }

        function stopSequence() {
            isRunning = false;
            clearTimeout(timeoutId);
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            playBtn.disabled = false;
            stopBtn.disabled = true;
        }

        playBtn.addEventListener('click', startSequence);
        stopBtn.addEventListener('click', stopSequence);
    </script>
