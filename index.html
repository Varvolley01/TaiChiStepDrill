<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tai Chi Step Drill</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --panel-bg: #242432;
            --accent-color: #2e7d32;
            --accent-hover: #388e3c;
            --stop-color: #c62828;
            --stop-hover: #d32f2f;
            --reset-color: #0277bd;
            --reset-hover: #0288d1;
            --text-main: #e0e0e0;
            --text-muted: #a0a0b0;
            --active-square: #4caf50;
            --facing-indicator: #ffeb3b;
            --border-color: #38384d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 28px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Displays Section */
        .display-panel {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .instruction-display {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            min-height: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .status-val {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Controls Section */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-start { background-color: var(--accent-color); border: none; }
        .btn-start:hover:not(:disabled) { background-color: var(--accent-hover); }

        .btn-stop { background-color: var(--stop-color); border: none; }
        .btn-stop:hover:not(:disabled) { background-color: var(--stop-hover); }

        .btn-reset { background-color: var(--reset-color); border: none; }
        .btn-reset:hover:not(:disabled) { background-color: var(--reset-hover); }

        /* Settings Inputs */
        .settings-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.15);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 272px; /* Matches the exact width of the 3x3 grid container */
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        input[type="number"] {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        input[type="range"] {
            flex-grow: 1; /* Allows the slider track to expand across the full 272px box */
            accent-color: var(--accent-color);
        }

        .slider-val {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 45px;
            text-align: right;
        }

        /* 3x3 Grid View */
        .grid-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 272px; /* 3 * 80px + 2 * 8px gap + 2 * 8px padding = 272px */
        }

        .cell {
            background-color: rgba(55, 55, 55, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .cell.active {
            background-color: rgba(76, 175, 80, 0.2);
            border-color: var(--active-square);
            box-shadow: inset 0 0 10px rgba(76, 175, 80, 0.4);
        }

        /* Facing Indicator (Pointer inside square) */
        .cell.active::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid var(--facing-indicator);
            transition: transform 0.3s ease;
        }

        /* Pointer rotations for North, East, South, West */
        .cell.active[data-facing="N"]::after { transform: rotate(0deg); }
        .cell.active[data-facing="E"]::after { transform: rotate(90deg); }
        .cell.active[data-facing="S"]::after { transform: rotate(180deg); }
        .cell.active[data-facing="W"]::after { transform: rotate(270deg); }

        .keyboard-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        kbd {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tai Chi Step Drill</h1>
            <div class="subtitle">Footwork & Positioning Practice</div>
        </header>

        <!-- Command & Status Display -->
        <div class="display-panel">
            <div id="instructionDisplay" class="instruction-display">READY</div>
            <div class="status-bar">
                <div>Status: <span id="statusDisplay" class="status-val">Reset</span></div>
                <div>Facing: <span id="facingDisplay" class="status-val">North</span></div>
                <div>Lead Leg: <span id="leadDisplay" class="status-val">-</span></div>
            </div>
        </div>

        <!-- Interactive Grid -->
        <div class="grid-container">
            <div class="grid" id="drillGrid">
                <div class="cell" data-x="-1" data-y="1"></div>
                <div class="cell" data-x="0" data-y="1"></div>
                <div class="cell" data-x="1" data-y="1"></div>
                <div class="cell" data-x="-1" data-y="0"></div>
                <div class="cell active" data-x="0" data-y="0" data-facing="N"></div>
                <div class="cell" data-x="1" data-y="0"></div>
                <div class="cell" data-x="-1" data-y="-1"></div>
                <div class="cell" data-x="0" data-y="-1"></div>
                <div class="cell" data-x="1" data-y="-1"></div>
            </div>
        </div>

        <!-- Settings Section -->
        <div class="settings-panel">
            <div class="setting-group">
                <label for="stepsInput">Remaining Steps</label>
                <input type="number" id="stepsInput" min="3" max="999" value="30">
            </div>
            <div class="setting-group">
                <label for="pauseSlider">Pause Time</label>
                <div class="setting-control">
                    <input type="range" id="pauseSlider" min="0" max="4" step="0.25" value="3">
                    <span id="pauseValueDisplay" class="slider-val">3.00s</span>
                </div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls-grid">
            <button id="startBtn" class="btn btn-start">Start</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop</button>
            <button id="resetBtn" class="btn btn-reset">Reset</button>
        </div>

        <div class="keyboard-hint">
            Press <kbd>Space</kbd> to Start / Stop
        </div>
    </div>

    <script>
        class AudioEngine {
            constructor() {
                this.audioFiles = {
                    'WUJI': 'data:audio/mp3;base64,INSERT BASE64 FILE HERE',
                    'LEFT EN GARDE': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'RIGHT EN GARDE': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'SHIFT': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'SWITCH': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'STEP': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'BACK': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'INSIDE': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE',
                    'OUTSIDE': 'data:audio/mp3;base64, INSERT BASE64 FILE HERE'
                };

                this.currentAudio = null;
            }

            speak(commandText) {
                return new Promise((resolve) => {
                    this.stop();

                    const filePath = this.audioFiles[commandText];
                    
                    if (!filePath) {
                        console.warn(`Audio file not configured for command: ${commandText}`);
                        resolve();
                        return;
                    }

                    this.currentAudio = new Audio(filePath);
                    this.currentAudio.onended = () => resolve();
                    this.currentAudio.onerror = (e) => {
                        console.error(`Error loading audio file "${filePath}":`, e);
                        resolve();
                    };

                    this.currentAudio.play().catch(err => {
                        console.error("Playback prevented or failed:", err);
                        resolve();
                    });
                });
            }

            stop() {
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    this.currentAudio = null;
                }
            }
        }

        class MovementEngine {
            static DIRECTIONS = ['N', 'E', 'S', 'W'];
            static DIRECTION_NAMES = { N: 'North', E: 'East', S: 'South', W: 'West' };
            static COMMANDS = ['SHIFT', 'SWITCH', 'STEP', 'BACK', 'INSIDE', 'OUTSIDE'];

            constructor() {
                this.reset();
            }

            reset() {
                this.x = 0;
                this.y = 0;
                this.facingIdx = 0;
                this.leadLeg = 'Left';
            }

            get facing() {
                return MovementEngine.DIRECTIONS[this.facingIdx];
            }

            get facingName() {
                return MovementEngine.DIRECTION_NAMES[this.facing];
            }

            isMoveLegal(command) {
                const simulatedState = {
                    x: this.x,
                    y: this.y,
                    facingIdx: this.facingIdx,
                    leadLeg: this.leadLeg
                };

                this._applyCommandToState(command, simulatedState);

                return simulatedState.x >= -1 && simulatedState.x <= 1 &&
                       simulatedState.y >= -1 && simulatedState.y <= 1;
            }

            executeCommand(command) {
                const state = {
                    x: this.x,
                    y: this.y,
                    facingIdx: this.facingIdx,
                    leadLeg: this.leadLeg
                };
                this._applyCommandToState(command, state);
                
                this.x = state.x;
                this.y = state.y;
                this.facingIdx = state.facingIdx;
                this.leadLeg = state.leadLeg;
            }

            _applyCommandToState(command, state) {
                const isLeft = state.leadLeg === 'Left';

                switch (command) {
                    case 'SHIFT':
                        state.facingIdx = (state.facingIdx + (isLeft ? 1 : 3)) % 4;
                        state.leadLeg = isLeft ? 'Right' : 'Left';
                        break;

                    case 'SWITCH':
                        state.leadLeg = isLeft ? 'Right' : 'Left';
                        break;

                    case 'STEP':
                        this._moveRelative(state, 'FORWARD');
                        state.leadLeg = isLeft ? 'Right' : 'Left';
                        break;

                    case 'BACK':
                        this._moveRelative(state, 'BACK');
                        state.leadLeg = isLeft ? 'Right' : 'Left';
                        break;

                    case 'INSIDE':
                        this._moveRelative(state, isLeft ? 'RIGHT' : 'LEFT');
                        break;

                    case 'OUTSIDE':
                        this._moveRelative(state, isLeft ? 'LEFT' : 'RIGHT');
                        state.leadLeg = isLeft ? 'Right' : 'Left';
                        break;
                }
            }

            _moveRelative(state, relativeDir) {
                const vectors = {
                    FORWARD: [0, 1],
                    BACK:    [0, -1],
                    LEFT:    [-1, 0],
                    RIGHT:   [1, 0]
                };

                const [relX, relY] = vectors[relativeDir];
                let absX = 0, absY = 0;

                switch (state.facingIdx) {
                    case 0: absX = relX;  absY = relY;  break; // N
                    case 1: absX = relY;  absY = -relX; break; // E
                    case 2: absX = -relX; absY = -relY; break; // S
                    case 3: absX = -relY; absY = relX;  break; // W
                }

                state.x += absX;
                state.y += absY;
            }
        }

        class UIController {
            constructor() {
                this.instructionDisplay = document.getElementById('instructionDisplay');
                this.statusDisplay = document.getElementById('statusDisplay');
                this.facingDisplay = document.getElementById('facingDisplay');
                this.leadDisplay = document.getElementById('leadDisplay');
                
                this.stepsInput = document.getElementById('stepsInput');
                this.pauseSlider = document.getElementById('pauseSlider');
                this.pauseValueDisplay = document.getElementById('pauseValueDisplay');
                
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.resetBtn = document.getElementById('resetBtn');
                
                this.cells = document.querySelectorAll('.cell');
                
                this._initSliderListener();
            }

            _initSliderListener() {
                this.pauseSlider.addEventListener('input', () => {
                    this.pauseValueDisplay.textContent = `${parseFloat(this.pauseSlider.value).toFixed(2)}s`;
                });
            }

            getPauseTimeMs() {
                return parseFloat(this.pauseSlider.value) * 1000;
            }

            getInitialSteps() {
                let val = parseInt(this.stepsInput.value, 10);
                if (isNaN(val) || val < 3) val = 3;
                if (val > 999) val = 999;
                this.stepsInput.value = val;
                return val;
            }

            updateStepsDisplay(count) {
                this.stepsInput.value = count;
            }

            setInstruction(text) {
                this.instructionDisplay.textContent = text;
            }

            setStatus(status) {
                this.statusDisplay.textContent = status;
            }

            updateStateView(engine) {
                this.facingDisplay.textContent = engine.facingName;
                this.leadDisplay.textContent = engine.leadLeg;

                this.cells.forEach(cell => {
                    const cx = parseInt(cell.getAttribute('data-x'), 10);
                    const cy = parseInt(cell.getAttribute('data-y'), 10);

                    if (cx === engine.x && cy === engine.y) {
                        cell.classList.add('active');
                        cell.setAttribute('data-facing', engine.facing);
                    } else {
                        cell.classList.remove('active');
                        cell.removeAttribute('data-facing');
                    }
                });
            }

            setControlsRunningState(isRunning) {
                this.startBtn.disabled = isRunning;
                this.stopBtn.disabled = !isRunning;
                this.stepsInput.disabled = isRunning;
            }
        }

        class DrillApp {
            constructor() {
                this.speech = new AudioEngine();
                this.movement = new MovementEngine();
                this.ui = new UIController();

                this.isRunning = false;
                this.userChosenSteps = 30;
                this.remainingSteps = 30;
                this.lastCommand = null;
                this.abortController = null;

                this._bindEvents();
            }

            _bindEvents() {
                this.ui.startBtn.addEventListener('click', () => this.start());
                this.ui.stopBtn.addEventListener('click', () => this.stop());
                this.ui.resetBtn.addEventListener('click', () => this.reset());

                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                        e.preventDefault();
                        if (this.isRunning) {
                            this.stop();
                        } else {
                            this.start();
                        }
                    }
                });

                this.ui.stepsInput.addEventListener('change', () => {
                    this.userChosenSteps = this.ui.getInitialSteps();
                });
            }

            _sleep(ms, signal) {
                return new Promise((resolve, reject) => {
                    if (signal?.aborted) return reject(new DOMException('Aborted', 'AbortError'));
                    
                    const timer = setTimeout(() => resolve(), ms);
                    
                    signal?.addEventListener('abort', () => {
                        clearTimeout(timer);
                        reject(new DOMException('Aborted', 'AbortError'));
                    });
                });
            }

            async start() {
                if (this.isRunning) return;

                this.isRunning = true;
                this.abortController = new AbortController();
                const signal = this.abortController.signal;

                this.userChosenSteps = this.ui.getInitialSteps();
                this.remainingSteps = this.userChosenSteps;
                
                this.ui.setControlsRunningState(true);
                this.ui.setStatus('Running');

                this.movement.reset();
                this.lastCommand = null;
                this.ui.updateStateView(this.movement);

                try {
                    const initialGuard = Math.random() < 0.5 ? 'LEFT EN GARDE' : 'RIGHT EN GARDE';
                    this.movement.leadLeg = initialGuard.startsWith('LEFT') ? 'Left' : 'Right';

                    await this._executeStepSequence('WUJI', signal);

                    const guardPromise = this._executeStepSequence(initialGuard, signal);
                    this.remainingSteps--;
                    this.ui.updateStepsDisplay(this.remainingSteps);
                    await guardPromise;

                    while (this.isRunning && this.remainingSteps > 0) {
                        if (this.remainingSteps === 1) {
                            const stepPromise = this._executeStepSequence('WUJI', signal);
                            this.remainingSteps--;
                            this.ui.updateStepsDisplay(this.remainingSteps);
                            await stepPromise;

                            this.movement.reset();
                            this.ui.updateStateView(this.movement);
                            this.ui.setStatus('Finished');
                            this.stop(false);
                            break;
                        } else {
                            const command = this._selectLegalCommand();
                            const seqPromise = this._executeStepSequence(command, signal);
                            
                            this.remainingSteps--;
                            this.ui.updateStepsDisplay(this.remainingSteps);

                            await seqPromise;
                        }
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Execution Error:', err);
                    }
                }
            }

            _selectLegalCommand() {
                const candidateList = [...MovementEngine.COMMANDS];
                let command = '';
                let isValid = false;

                while (!isValid) {
                    const randomIndex = Math.floor(Math.random() * candidateList.length);
                    command = candidateList[randomIndex];

                    if (command === this.lastCommand && Math.random() < 0.7) {
                        continue;
                    }

                    if (this.movement.isMoveLegal(command)) {
                        isValid = true;
                    }
                }

                this.lastCommand = command;
                return command;
            }

            async _executeStepSequence(commandText, signal) {
                if (!this.isRunning) return;

                this.ui.setInstruction(commandText);
                
                if (MovementEngine.COMMANDS.includes(commandText)) {
                    this.movement.executeCommand(commandText);
                }

                await this.speech.speak(commandText);

                if (signal.aborted) throw new DOMException('Aborted', 'AbortError');

                this.ui.updateStateView(this.movement);

                const pauseMs = this.ui.getPauseTimeMs();
                if (pauseMs > 0) {
                    await this._sleep(pauseMs, signal);
                }
            }

            stop(updateUi = true) {
                this.isRunning = false;
                if (this.abortController) {
                    this.abortController.abort();
                }
                this.speech.stop();

                if (updateUi) {
                    this.ui.setControlsRunningState(false);
                    this.ui.setStatus('Stopped');
                }
            }

            reset() {
                this.stop(false);
                this.movement.reset();

                this.ui.setInstruction('READY');
                this.ui.setStatus('Reset');
                
                this.remainingSteps = this.userChosenSteps;
                this.ui.updateStepsDisplay(this.userChosenSteps);
                
                this.ui.updateStateView(this.movement);
                this.ui.setControlsRunningState(false);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new DrillApp();
        });
    </script>
</body>
</html>
